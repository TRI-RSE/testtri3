[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "testtri3"
dynamic = ["version"]
description = "A simple Python library for string utilities"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["string", "text", "utilities"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/TRI-IE/testtri3"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
# version is derived from git tags (e.g. v0.0.1 → 0.0.1)
